      PAT: "ghp_placeholder_not_a_real_token_1234567890ab"
      TELEGRAM_TOKEN: "0000000000:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      POLYGONSCAN_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      FTMSCAN_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      ETHERSCAN_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      BSCSCAN_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      ARBISCAN_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      SNOWTRACE_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
